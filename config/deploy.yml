service: voicetts
image: ghcr.io/globalfunc/voicettsdemo

ssh:
  user: root

servers:
  web:
    hosts:
      - 46.101.168.59
    options:
      add-host: "host.docker.internal:host-gateway"

proxy:
  ssl: true
  host: voicetts.mvpvibes.eu
  app_port: 80

registry:
  server: ghcr.io
  username: globalfunc
  password:
    - KAMAL_REGISTRY_PASSWORD   # GitHub PAT with packages:read + packages:write scopes

builder:
  arch: amd64
  args:
    VITE_APP_NAME: VoiceTTS
    VITE_REVERB_HOST: voicetts.mvpvibes.eu
    VITE_REVERB_PORT: "443"
    VITE_REVERB_SCHEME: wss
  secrets:
    - VITE_REVERB_APP_KEY

env:
  clear:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://voicetts.mvpvibes.eu
    DB_CONNECTION: pgsql
    DB_HOST: host.docker.internal
    DB_PORT: "5432"
    DB_DATABASE: voicetts
    DB_USERNAME: voicetts
    AWS_DEFAULT_REGION: auto
    AWS_BUCKET: tts-bucket
    AWS_USE_PATH_STYLE_ENDPOINT: "false"
    BROADCAST_CONNECTION: reverb
    FILESYSTEM_DISK: s3
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    REVERB_HOST: voicetts.mvpvibes.eu
    REVERB_PORT: "443"
    REVERB_SCHEME: wss
    REVERB_SERVER_HOST: "0.0.0.0"
    REVERB_SERVER_PORT: "8080"
    LOCAL_TTS_WORKER_ENABLED: "false"
    RUNPOD_TTS_TIMEOUT: "180"
    RUNPOD_VC_TIMEOUT: "600"
  secret:
    - APP_KEY
    - DB_PASSWORD
    - AWS_ENDPOINT
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_URL
    - REVERB_APP_ID
    - REVERB_APP_KEY
    - REVERB_APP_SECRET
    - RUNPOD_API_KEY
    - RUNPOD_TTS_ENDPOINT_ID
    - RUNPOD_VC_ENDPOINT_ID
