name: Build and publish Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'VoiceTTS' }}
            VITE_REVERB_APP_KEY=${{ vars.VITE_REVERB_APP_KEY || 'voicetts-key' }}
            VITE_REVERB_HOST=${{ vars.VITE_REVERB_HOST || 'localhost' }}
            VITE_REVERB_PORT=${{ vars.VITE_REVERB_PORT || '8080' }}
            VITE_REVERB_SCHEME=${{ vars.VITE_REVERB_SCHEME || 'http' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
